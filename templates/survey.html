<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <!-- SurveyJS is vendored in static/, not pulled from a CDN. The notice this
       page carries says no other site is contacted while someone answers, and
       that has to be true of the questionnaire engine too. -->
  <link href="/static/survey-core.min.css" rel="stylesheet">
  <style>
    /* The whole SurveyJS 3.x palette derives from one token by relative-colour
       arithmetic, so recolouring the form into the results-page family costs a
       single declaration instead of a theme file. It has to name .sd-theme-root
       and not only :root: SurveyJS declares the token on that element, and a
       custom property set on a descendant beats an inherited one whatever the
       specificity of the selector that set it. */
    /* SurveyJS asks for Open Sans and ships no webfont for it, so on a machine
       that does not have it the whole questionnaire falls back to the browser
       default — Times, in practice, because the declaration names no generic
       family. The results page uses the system stack; so does this one now. */
    :root, .sd-theme-root {
      --sjs2-color-project-brand-600: #2b4a73;
      --sjs2-typography-font-family-text:
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: #f4f6f9;
      color: #1a202c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding-bottom: 40px;   /* clears the fixed footer */
    }

    /* --- header, always visible ------------------------------------- */
    header {
      position: sticky; top: 0; z-index: 30;
      height: 52px; background: #1a1d27; border-bottom: 1px solid #2d3148;
      display: flex; align-items: center; gap: 0.9rem;
      padding: 0 1.25rem;
    }
    header .brand { font-size: 0.9rem; font-weight: 700; color: #fff; }
    header .sub {
      font-size: 0.78rem; color: #718096;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    header .spacer { flex: 1; }

    #lang-bar { display: flex; gap: 0.3rem; }
    .lang-btn {
      padding: 0.2rem 0.55rem;
      border: 1px solid #3d4258; border-radius: 99px;
      background: transparent; color: #a0aec0;
      font-size: 0.7rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: all 0.15s;
    }
    .lang-btn:hover  { border-color: #4a6fa5; color: #cbd5e0; }
    .lang-btn.active { border-color: #4a6fa5; background: #4a6fa5; color: #fff; }

    .notice-link {
      background: none; border: none; padding: 0;
      font-family: inherit; font-size: 0.75rem; color: #718096;
      cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
      white-space: nowrap;
    }
    header .notice-link:hover { color: #cbd5e0; }

    /* --- the questionnaire ------------------------------------------- */
    main {
      max-width: 860px; margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* The questionnaire reads as one card on the grey field, the same idiom as
       the results page. No `overflow: hidden` here: SurveyJS renders dropdown
       popups inside this element, and clipping would cut them off. */
    .sd-root-modern {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }

    /* --- footer, always visible -------------------------------------- */
    footer {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      height: 40px; background: #fff; border-top: 1px solid #e2e8f0;
      display: flex; align-items: center; gap: 0.9rem;
      padding: 0 1.25rem;
      font-size: 0.75rem; color: #a0aec0;
    }
    footer .spacer { flex: 1; }
    footer .notice-link { color: #4a6fa5; font-weight: 600; }
    footer .notice-link:hover { color: #2b4a73; }

    @media (max-width: 620px) {
      header .sub { display: none; }
      header, footer { padding: 0 0.9rem; gap: 0.6rem; }
      footer .brand-line { display: none; }
    }

    /* --- the notice --------------------------------------------------- */
    .sheet {
      display: none; position: fixed; inset: 0; z-index: 60;
      background: rgba(26, 32, 44, 0.55);
      align-items: flex-start; justify-content: center;
      padding: 3rem 1rem; overflow-y: auto;
    }
    .sheet.open { display: flex; }
    .sheet-inner {
      background: #fff; border-radius: 12px; max-width: 680px; width: 100%;
      padding: 1.9rem 2.1rem 1.6rem; position: relative; margin: auto;
    }
    .sheet-close {
      position: absolute; top: 0.9rem; right: 1.1rem; background: none;
      border: none; font-size: 1.1rem; color: #a0aec0; cursor: pointer;
      line-height: 1;
    }
    .sheet h2 {
      font-size: 1.15rem; line-height: 1.35; margin: 0 2rem 1.3rem 0;
    }
    .sheet h3 {
      font-size: 0.92rem; margin: 1.4rem 0 0.4rem; color: #2b4a73;
    }
    .sheet p {
      font-size: 0.87rem; line-height: 1.7; color: #2d3748; margin: 0 0 0.7rem;
    }
    .sheet .contact {
      margin-top: 1.6rem; padding-top: 1rem; border-top: 1px solid #edf2f7;
      font-size: 0.82rem; color: #718096;
    }
    .sheet .done {
      margin-top: 1.2rem; background: #2b4a73; color: #fff; border: none;
      border-radius: 6px; padding: 0.5rem 1.2rem;
      font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .sheet .done:hover { background: #22405f; }
    @media (max-width: 620px) {
      .sheet { padding: 1rem 0.6rem; }
      .sheet-inner { padding: 1.5rem 1.2rem 1.3rem; }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">Survey</span>
    <span class="sub">{{ title }}</span>
    <span class="spacer"></span>
    <div id="lang-bar">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="de">DE</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="it">IT</button>
    </div>
    <button class="notice-link" data-notice-label onclick="openNotice()"></button>
  </header>

  <main>
    <div id="survey-container"></div>
  </main>

  <footer>
    <span class="brand-line">{{ footer_line }}</span>
    <span class="spacer"></span>
    <button class="notice-link" data-notice-label onclick="openNotice()"></button>
  </footer>

  <div class="sheet" id="notice" onclick="if (event.target === this) closeNotice()">
    <div class="sheet-inner" role="dialog" aria-modal="true" aria-labelledby="notice-title">
      <button class="sheet-close" id="notice-x" onclick="closeNotice()">&#10005;</button>
      <h2 id="notice-title"></h2>
      <div id="notice-body"></div>
      <p class="contact" id="notice-contact"></p>
      <button class="done" id="notice-done" onclick="closeNotice()"></button>
    </div>
  </div>

  <script src="/static/survey.core.min.js"></script>
  <!-- SurveyJS bundles only English UI strings in the core. Without this the
       navigation of an Italian questionnaire still says "Next". -->
  <script src="/static/survey.i18n.min.js"></script>
  <script src="/static/survey-js-ui.min.js"></script>
  <script>
    var schema          = {{ schema | tojson }};
    var slug            = {{ slug  | tojson }};
    var assigned_pages  = {{ assigned_pages | tojson }};
    var pool_pages      = {{ pool_pages | tojson }};
    var assignment_ids  = {{ assignment_ids | tojson }};
    var conditions      = {{ conditions | tojson }};
    var page_orders     = {{ page_orders | tojson }};
    var panel_token     = {{ panel_token | tojson }};
    var NOTICE          = {{ notice | tojson }};
    var LANGS           = ["en", "de", "fr", "it"];
    // The completion page is rendered by SurveyJS from the schema, so this one
    // line of ours has to carry its own translations.
    var RESULTS_LINK_TEXT = {
      "":   "See what everyone answered →",
      en:   "See what everyone answered →",
      de:   "Ansehen, was alle geantwortet haben →",
      fr:   "Voir ce que tout le monde a répondu →",
      it:   "Guarda cosa hanno risposto gli altri →",
    };

    // --- the notice ---------------------------------------------------
    // Ours, not the study's, and available in all four languages whatever the
    // questionnaire offers: a single-language English survey answered by an
    // Italian speaker should still explain itself in Italian.
    var noticeLang = "en";

    function renderNotice(lang) {
      var n = NOTICE[lang] || NOTICE.en;
      noticeLang = NOTICE[lang] ? lang : "en";
      document.getElementById("notice-title").textContent = n.title;
      var body = document.getElementById("notice-body");
      body.textContent = "";
      n.sections.forEach(function(sec) {
        var h = document.createElement("h3");
        h.textContent = sec.h;
        body.appendChild(h);
        sec.p.forEach(function(text) {
          var p = document.createElement("p");
          p.textContent = text;
          body.appendChild(p);
        });
      });
      document.getElementById("notice-contact").textContent = n.contact;
      document.getElementById("notice-done").textContent = n.close;
      document.getElementById("notice-x").setAttribute("aria-label", n.close);
      document.querySelectorAll("[data-notice-label]").forEach(function(el) {
        el.textContent = n.link;
      });
    }

    function openNotice() {
      document.getElementById("notice").classList.add("open");
    }
    function closeNotice() {
      document.getElementById("notice").classList.remove("open");
    }
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeNotice();
    });

    // Scan schema recursively for locale keys inside localized string objects.
    // A localized string object has all-string values and at least one key that
    // is a known locale code or "default".
    function getAvailableLocales(obj) {
      var found = {};
      function isLocaleObj(o) {
        if (!o || typeof o !== "object" || Array.isArray(o)) return false;
        var keys = Object.keys(o);
        return keys.length > 0
          && keys.every(function(k) { return typeof o[k] === "string"; })
          && keys.some(function(k) { return k === "default" || LANGS.indexOf(k) !== -1; });
      }
      function walk(val) {
        if (!val || typeof val !== "object") return;
        if (Array.isArray(val)) { val.forEach(walk); return; }
        if (isLocaleObj(val)) {
          Object.keys(val).forEach(function(k) {
            if (LANGS.indexOf(k) !== -1) found[k] = true;
            if (k === "default")         found["en"] = true; // default maps to EN
          });
        } else {
          Object.keys(val).forEach(function(k) { walk(val[k]); });
        }
      }
      walk(obj);
      return LANGS.filter(function(l) { return found[l]; });
    }

    function browserLang() {
      return (navigator.language || "en").split("-")[0].toLowerCase();
    }

    function detectLocale(available) {
      var lang = browserLang();
      return available.indexOf(lang) !== -1 ? lang : available[0];
    }

    function setLocale(survey, lang) {
      survey.locale = lang === "en" ? "" : lang;
      document.documentElement.lang = lang;
      document.querySelectorAll(".lang-btn").forEach(function(btn) {
        btn.classList.toggle("active", btn.dataset.lang === lang);
      });
      renderNotice(lang);
    }

    document.addEventListener("DOMContentLoaded", function() {
      // --- randomization: reorder pages before the model is built ---
      // A pool can assign a presentation order along with its condition. The
      // named pages are put back into the slots they collectively occupy, in
      // the order given, so counterbalancing needs no duplicate pages — and
      // therefore no duplicate question names — in the schema.
      if (page_orders && page_orders.length && schema.pages) {
        page_orders.forEach(function(po) {
          var idx = (po.pages || []).map(function(name) {
            for (var i = 0; i < schema.pages.length; i++) {
              if (schema.pages[i].name === name) return i;
            }
            return -1;
          }).filter(function(i) { return i >= 0; });
          if (idx.length < 2) return;
          var moved = idx.map(function(i) { return schema.pages[i]; });
          var slots = idx.slice().sort(function(a, b) { return a - b; });
          slots.forEach(function(slot, k) { schema.pages[slot] = moved[k]; });
        });
      }

      var survey = new Survey.Model(schema);

      // --- randomization: hide non-assigned pool pages ---
      if (assigned_pages && pool_pages) {
        survey.pages.forEach(function(page) {
          if (pool_pages.indexOf(page.name) !== -1 && assigned_pages.indexOf(page.name) === -1) {
            page.visible = false;
          }
        });
      }

      // --- condition variables ---
      // If the server supplied explicit conditions (pool.condition_var configured),
      // use those directly. Otherwise fall back to the legacy convention:
      // a pool page named 'info_X' (single letter) → condition = 'X'.
      // survey.setVariable() makes variables available in visibleIf expressions
      // without polluting response data; values are captured in onComplete below.
      if (conditions && Object.keys(conditions).length > 0) {
        Object.keys(conditions).forEach(function(k) { survey.setVariable(k, conditions[k]); });
      } else if (assigned_pages) {
        for (var i = 0; i < assigned_pages.length; i++) {
          var m = assigned_pages[i].match(/^info_([a-z])$/i);
          if (m) { survey.setVariable('condition', m[1].toUpperCase()); break; }
        }
      }

      // --- panel token ---
      // Exposed as {panelToken} so the schema can branch on it if it needs to,
      // and echoed back on submit so the server can build the return URL.
      if (panel_token) survey.setVariable('panelToken', panel_token);

      // --- timing ---
      var t0          = Date.now();   // survey start
      var pageT0      = Date.now();   // current page start
      var pageTimes   = {};

      survey.onCurrentPageChanged.add(function(sender, options) {
        var secs = Math.round((Date.now() - pageT0) / 1000);
        pageTimes[options.oldCurrentPage.name] = secs;
        pageT0 = Date.now();
      });

      // Build language bar with only available locales
      var available = getAvailableLocales(schema);
      var bar = document.getElementById("lang-bar");
      if (available.length <= 1) {
        bar.style.display = "none";
      } else {
        bar.querySelectorAll(".lang-btn").forEach(function(btn) {
          if (available.indexOf(btn.dataset.lang) === -1) btn.style.display = "none";
        });
      }

      var locale = detectLocale(available.length ? available : ["en"]);
      setLocale(survey, locale);
      // A one-language questionnaire gives the reader no switch to press, so
      // the notice follows the browser instead of following the form.
      if (available.length <= 1 && NOTICE[browserLang()]) renderNotice(browserLang());

      document.querySelectorAll(".lang-btn").forEach(function(btn) {
        btn.addEventListener("click", function() {
          setLocale(survey, btn.dataset.lang);
        });
      });

      survey.onComplete.add(function(sender, options) {
        // record last page
        pageTimes[sender.currentPage.name] = Math.round((Date.now() - pageT0) / 1000);

        var payload = Object.assign({}, sender.data, {
          _timing: {
            total_seconds: Math.round((Date.now() - t0) / 1000),
            pages: pageTimes
          }
        });
        if (assigned_pages) payload._assignment = assigned_pages.join(",");
        // the server marks these pending assignments as completed, which is what
        // keeps the balancing counts tied to responses rather than to page loads
        if (assignment_ids && assignment_ids.length) payload._assignment_ids = assignment_ids;
        if (conditions && Object.keys(conditions).length > 0) {
          payload._conditions = conditions;
        } else {
          var cond = survey.getVariable('condition');
          if (cond) payload._condition = cond;
        }
        if (panel_token) payload._panel_token = panel_token;

        options.showSaveInProgress();
        fetch('/s/' + slug + '/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(function(r) {
          return r.json().catch(function() { return {}; }).then(function(body) {
            if (r.ok) {
              options.showSaveSuccess();
            } else {
              options.showSaveError();
            }
            // Panel respondents must land back on the provider or they cannot be
            // credited. Give the completion state a moment to paint first.
            if (body && body.redirect) {
              setTimeout(function() { window.location.replace(body.redirect); }, 1200);
              return;
            }
            // A results page this person may see, with their own answers marked.
            // The link is only ever sent when the report reaches respondents, so
            // there is nothing here to hide and nothing to check.
            if (r.ok && body && body.results_url) {
              setTimeout(function() {
                var host = document.querySelector('.sd-completedpage')
                        || document.getElementById('survey-container');
                if (!host || host.querySelector('.results-link')) return;
                var p = document.createElement('p');
                p.className = 'results-link';
                p.style.cssText = 'margin-top:1.2rem;text-align:center;font-size:0.95rem';
                var a = document.createElement('a');
                a.href = body.results_url;
                a.textContent = RESULTS_LINK_TEXT[survey.locale] || RESULTS_LINK_TEXT.en;
                a.style.cssText = 'color:#4a6fa5;font-weight:600';
                p.appendChild(a);
                host.appendChild(p);
              }, 300);
            }
          });
        })
        .catch(function() { options.showSaveError(); });
      });

      survey.render(document.getElementById('survey-container'));
    });
  </script>
</body>
</html>
